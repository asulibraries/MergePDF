name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  tests:
    name: Integration tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build base image
        run: docker build -f Dockerfile -t mergepdf:latest .

      - name: Build test image
        run: docker build -f Dockerfile.test -t mergepdf-test .

      - name: Run tests in container
        run: docker run --rm mergepdf-test